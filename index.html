<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FlowPlayer" />
  <meta name="theme-color" content="#0B0E14" />
  <title>FlowPlayer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0B0E14;
      --surface: #141820;
      --surface-hover: #1C2230;
      --surface-active: #252D3D;
      --accent: #F59E0B;
      --accent-hover: #D97706;
      --text: #E5E7EB;
      --text-muted: #6B7280;
      --border: #1F2937;
      --error: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    button { font-family: inherit; cursor: pointer; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    a { text-decoration: none; }

    /* ===== SETUP ===== */
    .setup-container {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh; padding: 20px;
    }
    .setup-card {
      background: var(--surface); border-radius: 16px; padding: 36px 28px;
      max-width: 460px; width: 100%; border: 1px solid var(--border);
    }
    .setup-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo-icon {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--accent); color: #000; font-size: 20px; font-weight: 700;
    }
    .logo-text { font-size: 28px; font-weight: 700; }
    .setup-subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
    .setup-section-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .setup-instructions { color: var(--text-muted); font-size: 14px; line-height: 1.5; }
    .setup-steps {
      color: var(--text-muted); font-size: 13px; line-height: 1.9;
      padding-left: 20px; margin-bottom: 20px;
    }
    .setup-steps a { color: var(--accent); }
    .input-group { display: flex; gap: 8px; }
    .input-field {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; color: var(--text);
      font-size: 14px; outline: none; font-family: inherit;
    }
    .btn-primary {
      background: var(--accent); color: #000; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    .btn-primary:disabled { opacity: 0.4; }

    /* ===== APP SHELL ===== */
    .app { max-width: 640px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface); position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-logo {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--accent); color: #000; font-size: 13px; font-weight: 700;
    }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-center { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .week-badge {
      background: var(--accent); color: #000; font-size: 11px; font-weight: 700;
      padding: 2px 10px; border-radius: 20px; letter-spacing: 0.5px;
    }
    .week-info { font-size: 11px; color: var(--text-muted); }
    .settings-btn {
      background: transparent; border: none; color: var(--text-muted); padding: 6px;
    }

    /* Tabs */
    .tab-bar {
      display: flex; border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .tab {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 0; background: transparent; border: none;
      border-bottom: 2px solid transparent; color: var(--text-muted);
      font-size: 14px; font-weight: 500; transition: all 0.2s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Content */
    .content { padding: 16px; }

    /* View toggle */
    .view-toggle {
      display: flex; gap: 4px; background: var(--surface);
      border-radius: 10px; padding: 3px; margin-bottom: 12px;
    }
    .toggle-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 8px 0; background: transparent; border: none; border-radius: 8px;
      color: var(--text-muted); font-size: 13px; transition: all 0.2s;
    }
    .toggle-btn.active { background: var(--surface-active); color: var(--text); }

    /* Channel indicator */
    .channel-indicator {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .channel-name { font-size: 18px; font-weight: 700; }
    .channel-counter { font-size: 12px; color: var(--text-muted); }

    /* Player */
    .player-wrapper {
      border-radius: 12px; overflow: hidden; background: #000;
      aspect-ratio: 16/9; margin-bottom: 8px; position: relative;
    }
    .player-inner { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .player-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; min-height: 180px; color: var(--text-muted);
    }
    .player-placeholder p { font-size: 14px; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    /* Video title */
    .video-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; line-height: 1.4; }

    /* Controls */
    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; align-items: center; }
    .control-group { display: flex; gap: 4px; }
    .ctrl-btn {
      display: flex; align-items: center; gap: 4px; padding: 8px 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 12px;
    }
    .ctrl-btn-accent {
      display: flex; align-items: center; gap: 4px; padding: 8px 12px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #000; font-size: 12px; font-weight: 600;
    }

    /* Speed menu */
    .speed-wrap { position: relative; }
    .speed-menu {
      position: absolute; bottom: 100%; left: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; margin-bottom: 4px; z-index: 20;
    }
    .speed-opt {
      display: block; width: 100%; padding: 8px 16px; background: transparent;
      border: none; color: var(--text); font-size: 13px; text-align: left;
    }
    .speed-opt.active { background: var(--accent); color: #000; font-weight: 600; }

    /* Error */
    .error-bar {
      background: rgba(239,68,68,0.15); border: 1px solid var(--error);
      border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--error);
      margin-bottom: 12px;
    }

    /* Lists */
    .list-title {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
    }
    .video-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px; background: transparent; border: none; border-radius: 8px;
      text-align: left; color: var(--text); transition: background 0.15s;
    }
    .video-item.active { background: var(--surface-hover); }
    .video-thumb {
      width: 80px; height: 45px; border-radius: 6px; object-fit: cover;
      flex-shrink: 0; background: var(--surface);
    }
    .video-info { flex: 1; min-width: 0; }
    .video-item-title {
      font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .video-item-channel { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .now-playing { color: var(--accent); font-size: 16px; flex-shrink: 0; }

    .channel-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; background: transparent; border: none;
      border-radius: 8px; text-align: left; color: var(--text); font-size: 14px;
    }
    .channel-item.active { background: var(--surface-hover); }
    .channel-dot { font-size: 12px; color: var(--accent); width: 16px; text-align: center; flex-shrink: 0; }
    .search-badge {
      font-size: 10px; color: var(--text-muted); background: var(--surface-active);
      padding: 2px 6px; border-radius: 4px; margin-left: auto;
    }

    /* Course */
    .course-card {
      background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .course-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .course-progress { font-size: 13px; color: var(--text-muted); }
    .course-open-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; background: var(--accent); color: #000;
      border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 14px;
    }
    .rotation-info {
      background: var(--surface); border-radius: 10px; padding: 14px;
      font-size: 13px; color: var(--text-muted); line-height: 1.5;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal-content {
      background: var(--surface); border-radius: 16px; padding: 28px;
      max-width: 400px; width: 100%; border: 1px solid var(--border);
    }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .setting-row { margin-bottom: 16px; }
    .setting-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .week-selector { display: flex; gap: 6px; }
    .week-btn {
      width: 40px; height: 40px; border-radius: 10px; background: var(--bg);
      border: 1px solid var(--border); color: var(--text); font-size: 16px; font-weight: 600;
    }
    .week-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* SVG icons in buttons */
    .icon { width: 16px; height: 16px; vertical-align: middle; }
    .icon-sm { width: 14px; height: 14px; vertical-align: middle; }

    /* iPhone notch safe area */
    @supports (padding-top: env(safe-area-inset-top)) {
      .header { padding-top: calc(12px + env(safe-area-inset-top)); }
      .content { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    }

    /* Iframe fix */
    #yt-player-target iframe { border-radius: 0 !important; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ============================================================
    // DATA
    // ============================================================
    const WEEKS = [
      { label: "Semana 1", channels: [
        { name: "JesusCopy", handle: "thejesuscopy", type: "channel" },
        { name: "Elevation Português", handle: "elevationportugues", type: "channel" },
        { name: "Hernandes Dias Lopes", handle: "hernandesdiaslopesoficial", type: "channel" },
        { name: "Andrea Vargas", query: "andrea vargas", type: "search" },
        { name: "IP Semear", handle: "ipsemear", type: "channel" },
        { name: "Thiago Nigro", handle: "ThiagoNigro", type: "channel" },
      ]},
      { label: "Semana 2", channels: [
        { name: "Pro Nobis Editora", handle: "ProNobisEditora", type: "channel" },
        { name: "Escola do Discípulo", channelId: "UCXDIsJpQCOi88jpt_AUGWbg", type: "channel" },
        { name: "Heber Campos Jr", handle: "HeberCamposJrOficial", type: "channel" },
        { name: "Talitha Pereira", handle: "TalithaPereira", type: "channel" },
        { name: "ICTV Online", handle: "ictv.online", type: "channel" },
        { name: "Escola Didaskalia", handle: "EscolaDidaskalia", type: "channel" },
        { name: "Casa da Rocha", handle: "casadarocha", type: "channel" },
      ]},
      { label: "Semana 3", channels: [
        { name: "Canal Eleve", handle: "CanalEleve", type: "channel" },
        { name: "Igreja Esperança", handle: "IgrejaEsperanca", type: "channel" },
        { name: "Família JesusCopy", handle: "familiajesuscopy", type: "channel" },
        { name: "L'Abri Brasil", handle: "labribrasil", type: "channel" },
        { name: "A Central Online", handle: "acentralonlineoficial", type: "channel" },
        { name: "PIB Guarapari", handle: "pibguarapari", type: "channel" },
        { name: "Pr. Elizeu Rodrigues", handle: "pastorelizeurodrigues", type: "channel" },
        { name: "Você Mais Rico", handle: "vocemaisrico", type: "channel" },
      ]},
      { label: "Semana 4", channels: [
        { name: "Escola Charles Spurgeon", handle: "EscolaCharlesSpurgeon", type: "channel" },
        { name: "Igreja Vértice", handle: "igrejavertice", type: "channel" },
        { name: "Igreja DT", handle: "igrejadt", type: "channel" },
        { name: "Minha Igreja na Cidade", handle: "MinhaIgrejanaCidade", type: "channel" },
        { name: "Ministério Fiel", handle: "ministeriofiel", type: "channel" },
        { name: "Bastter", handle: "Bastter", type: "channel" },
      ]},
    ];

    const PLATFORMS = [
      { name: "Loop — Invisible College", url: "https://loop.hubinvisiblecollege.com.br/", color: "#8B5CF6",
        courses: [{ name: "O Cuidado Integral do Ser Humano", lastLesson: "" }] },
      { name: "Hotmart", url: "https://hotmart.com/pt-br/club/ultra-black-friday-1", color: "#EF4444",
        courses: [{ name: "Investidor 33 Dias", lastLesson: "Módulo 6" }] },
      { name: "Coursify — Logos", url: "https://logos-portugues.coursify.me/student/courses/curso-completo-do-logos/sections/196358/contents/552596", color: "#3B82F6",
        courses: [{ name: "Curso Completo do Logos", lastLesson: "Aula Layouts" }] },
    ];

    const SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
    const YT_API = "https://www.googleapis.com/youtube/v3";

    // ============================================================
    // STATE
    // ============================================================
    let state = {
      apiKey: "",
      isSetup: false,
      activeTab: "videos",
      weekIndex: getWeekIndex(),
      channelIndex: 0,
      videoIndex: 0,
      viewMode: "videos",
      playbackSpeed: 1,
      platformIndex: 0,
      courseIndex: 0,
      showSettings: false,
      showSpeedMenu: false,
      fetchingVideos: false,
      error: "",
      channelVideos: {},
    };

    let ytPlayer = null;
    let ytReady = false;

    function getWeekIndex() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 1);
      return Math.floor((now - start) / (7 * 86400000)) % 4;
    }

    // ============================================================
    // STORAGE
    // ============================================================
    function saveLocal() {
      try {
        const s = { ...state };
        delete s.channelVideos;
        delete s.showSettings;
        delete s.showSpeedMenu;
        delete s.fetchingVideos;
        delete s.error;
        localStorage.setItem("fp-state", JSON.stringify(s));
      } catch {}
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem("fp-state");
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.apiKey) { state.apiKey = saved.apiKey; state.isSetup = true; }
        if (saved.weekIndex !== undefined) state.weekIndex = saved.weekIndex;
        if (saved.channelIndex !== undefined) state.channelIndex = saved.channelIndex;
        if (saved.videoIndex !== undefined) state.videoIndex = saved.videoIndex;
        if (saved.viewMode) state.viewMode = saved.viewMode;
        if (saved.playbackSpeed) state.playbackSpeed = saved.playbackSpeed;
        if (saved.platformIndex !== undefined) state.platformIndex = saved.platformIndex;
        if (saved.courseIndex !== undefined) state.courseIndex = saved.courseIndex;
        if (saved.activeTab) state.activeTab = saved.activeTab;
      } catch {}
    }

    // ============================================================
    // YT API HELPERS
    // ============================================================
    async function resolveChannelId(ch) {
      if (ch.channelId) return ch.channelId;
      if (!ch.handle) return null;
      const h = ch.handle.replace("@", "");

      let r = await fetch(`${YT_API}/channels?part=contentDetails,snippet&forHandle=${h}&key=${state.apiKey}`);
      let d = await r.json();
      if (d.items?.length) return d.items[0].id;

      r = await fetch(`${YT_API}/channels?part=contentDetails,snippet&forUsername=${h}&key=${state.apiKey}`);
      d = await r.json();
      if (d.items?.length) return d.items[0].id;

      // fallback: search
      r = await fetch(`${YT_API}/search?part=snippet&q=${h}&type=channel&maxResults=1&key=${state.apiKey}`);
      d = await r.json();
      if (d.items?.length) return d.items[0].snippet.channelId;

      return null;
    }

    async function fetchChannelVids(channelId, max = 8) {
      const cr = await fetch(`${YT_API}/channels?part=contentDetails&id=${channelId}&key=${state.apiKey}`);
      const cd = await cr.json();
      if (!cd.items?.length) return [];
      const uploads = cd.items[0].contentDetails.relatedPlaylists.uploads;

      const pr = await fetch(`${YT_API}/playlistItems?part=snippet&playlistId=${uploads}&maxResults=${max}&key=${state.apiKey}`);
      const pd = await pr.json();
      if (!pd.items) return [];

      return pd.items.map(i => ({
        id: i.snippet.resourceId.videoId,
        title: i.snippet.title,
        thumb: i.snippet.thumbnails?.medium?.url || i.snippet.thumbnails?.default?.url,
        published: i.snippet.publishedAt,
        channel: i.snippet.channelTitle,
      }));
    }

    async function fetchLiveStreams(channelId) {
      const r = await fetch(`${YT_API}/search?part=snippet&channelId=${channelId}&eventType=live&type=video&maxResults=5&key=${state.apiKey}`);
      const d = await r.json();
      if (!d.items) return [];
      return d.items.map(i => ({
        id: i.id.videoId,
        title: i.snippet.title,
        thumb: i.snippet.thumbnails?.medium?.url,
        published: i.snippet.publishedAt,
        channel: i.snippet.channelTitle,
        isLive: true,
      }));
    }

    async function searchVids(query, max = 8) {
      const r = await fetch(`${YT_API}/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=${max}&order=date&key=${state.apiKey}`);
      const d = await r.json();
      if (!d.items) return [];
      return d.items.map(i => ({
        id: i.id.videoId,
        title: i.snippet.title,
        thumb: i.snippet.thumbnails?.medium?.url,
        published: i.snippet.publishedAt,
        channel: i.snippet.channelTitle,
      }));
    }

    async function loadVideos(chIdx, mode) {
      const week = WEEKS[state.weekIndex];
      const ch = week.channels[chIdx];
      if (!ch) return;

      const key = `${state.weekIndex}-${chIdx}-${mode}`;
      if (state.channelVideos[key]?.length) return;

      state.fetchingVideos = true;
      state.error = "";
      render();

      try {
        let vids = [];
        if (ch.type === "search") {
          vids = await searchVids(ch.query);
        } else {
          const cid = await resolveChannelId(ch);
          if (!cid) { state.error = `Canal não encontrado: ${ch.name}`; state.fetchingVideos = false; render(); return; }
          vids = mode === "live" ? await fetchLiveStreams(cid) : await fetchChannelVids(cid);
        }
        state.channelVideos[key] = vids;
      } catch (e) {
        state.error = `Erro: ${e.message}`;
      }
      state.fetchingVideos = false;
      render();
    }

    // ============================================================
    // YT IFRAME PLAYER
    // ============================================================
    function loadYTApi() {
      if (document.getElementById("yt-iframe-api")) return;
      const tag = document.createElement("script");
      tag.id = "yt-iframe-api";
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function () { ytReady = true; playCurrentVideo(); };

    function playCurrentVideo() {
      const key = `${state.weekIndex}-${state.channelIndex}-${state.viewMode}`;
      const vids = state.channelVideos[key] || [];
      const vid = vids[state.videoIndex];
      if (!vid) return;

      const container = document.getElementById("yt-player-target");
      if (!container) return;

      if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
        ytPlayer.loadVideoById(vid.id);
        try { ytPlayer.setPlaybackRate(state.playbackSpeed); } catch {}
        return;
      }

      if (!ytReady) return;

      ytPlayer = new YT.Player("yt-player-target", {
        width: "100%",
        height: "100%",
        videoId: vid.id,
        playerVars: { autoplay: 1, controls: 1, modestbranding: 1, rel: 0, playsinline: 1 },
        events: {
          onReady: function (e) { e.target.setPlaybackRate(state.playbackSpeed); },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) nextVideo();
          },
        },
      });
    }

    function updateSpeed() {
      if (ytPlayer && typeof ytPlayer.setPlaybackRate === "function") {
        try { ytPlayer.setPlaybackRate(state.playbackSpeed); } catch {}
      }
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function nextVideo() {
      const key = `${state.weekIndex}-${state.channelIndex}-${state.viewMode}`;
      const vids = state.channelVideos[key] || [];
      if (state.videoIndex < vids.length - 1) {
        state.videoIndex++;
      } else {
        const week = WEEKS[state.weekIndex];
        if (state.channelIndex < week.channels.length - 1) {
          state.channelIndex++;
          state.videoIndex = 0;
          loadVideos(state.channelIndex, state.viewMode);
        }
      }
      saveLocal(); render();
      setTimeout(playCurrentVideo, 300);
    }

    function prevVideo() {
      if (state.videoIndex > 0) { state.videoIndex--; saveLocal(); render(); setTimeout(playCurrentVideo, 300); }
    }

    function nextChannel() {
      const week = WEEKS[state.weekIndex];
      if (state.channelIndex < week.channels.length - 1) {
        state.channelIndex++;
        state.videoIndex = 0;
        saveLocal(); render();
        loadVideos(state.channelIndex, state.viewMode).then(() => { render(); setTimeout(playCurrentVideo, 300); });
      }
    }

    function prevChannel() {
      if (state.channelIndex > 0) {
        state.channelIndex--;
        state.videoIndex = 0;
        saveLocal(); render();
        loadVideos(state.channelIndex, state.viewMode).then(() => { render(); setTimeout(playCurrentVideo, 300); });
      }
    }

    function selectChannel(i) {
      state.channelIndex = i;
      state.videoIndex = 0;
      saveLocal(); render();
      loadVideos(i, state.viewMode).then(() => { render(); setTimeout(playCurrentVideo, 300); });
    }

    function selectVideo(i) {
      state.videoIndex = i;
      saveLocal(); render();
      setTimeout(playCurrentVideo, 200);
    }

    function setViewMode(m) {
      state.viewMode = m;
      state.videoIndex = 0;
      saveLocal(); render();
      loadVideos(state.channelIndex, m).then(() => { render(); setTimeout(playCurrentVideo, 300); });
    }

    function refreshVideos() {
      const key = `${state.weekIndex}-${state.channelIndex}-${state.viewMode}`;
      delete state.channelVideos[key];
      loadVideos(state.channelIndex, state.viewMode).then(() => { render(); setTimeout(playCurrentVideo, 300); });
    }

    function setWeek(i) {
      state.weekIndex = i;
      state.channelIndex = 0;
      state.videoIndex = 0;
      state.showSettings = false;
      // Destroy old player
      if (ytPlayer) { try { ytPlayer.destroy(); } catch {} ytPlayer = null; }
      saveLocal(); render();
      loadVideos(0, state.viewMode).then(() => { render(); setTimeout(playCurrentVideo, 300); });
    }

    function nextPlatform() {
      state.platformIndex = (state.platformIndex + 1) % PLATFORMS.length;
      state.courseIndex = 0;
      saveLocal(); render();
    }

    function nextCourse() {
      const p = PLATFORMS[state.platformIndex];
      if (p.courses.length > 1) {
        state.courseIndex = (state.courseIndex + 1) % p.courses.length;
        saveLocal(); render();
      }
    }

    function selectPlatform(i) {
      state.platformIndex = i;
      state.courseIndex = 0;
      saveLocal(); render();
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener("keydown", function (e) {
      if (!state.isSetup) return;
      if (e.target.tagName === "INPUT") return;
      if (e.key === "n" || e.key === "N") { nextVideo(); }
      if (e.key === "p" || e.key === "P") { prevVideo(); }
      if (e.key === "ArrowRight" && e.shiftKey) { nextChannel(); }
      if (e.key === "ArrowLeft" && e.shiftKey) { prevChannel(); }
    });

    // ============================================================
    // RENDER
    // ============================================================
    function render() {
      const app = document.getElementById("app");
      if (!state.isSetup) { app.innerHTML = renderSetup(); return; }
      const week = WEEKS[state.weekIndex];
      const ch = week.channels[state.channelIndex];
      const key = `${state.weekIndex}-${state.channelIndex}-${state.viewMode}`;
      const vids = state.channelVideos[key] || [];
      const vid = vids[state.videoIndex];

      let html = `
        <div class="app">
          ${renderHeader(week)}
          ${renderTabs()}
          ${state.activeTab === "videos" ? renderVideosTab(week, ch, vids, vid) : renderCoursesTab()}
          ${state.showSettings ? renderSettingsModal() : ""}
        </div>`;
      app.innerHTML = html;

      // Re-create player if needed
      if (state.activeTab === "videos" && vid) {
        setTimeout(playCurrentVideo, 200);
      }
    }

    function renderSetup() {
      return `
        <div class="setup-container">
          <div class="setup-card">
            <div class="setup-logo">
              <span class="logo-icon">▶</span>
              <h1 class="logo-text">FlowPlayer</h1>
            </div>
            <p class="setup-subtitle">Seus canais e cursos em um só lugar.</p>
            <div>
              <h2 class="setup-section-title">YouTube API Key</h2>
              <p class="setup-instructions">Para buscar vídeos automaticamente:</p>
              <ol class="setup-steps">
                <li>Acesse <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a></li>
                <li>Crie um projeto (ou use um existente)</li>
                <li>Ative a <strong>YouTube Data API v3</strong></li>
                <li>Crie uma credencial → "Chave de API"</li>
                <li>Cole a chave abaixo</li>
              </ol>
              <div class="input-group">
                <input type="text" id="api-key-input" class="input-field" placeholder="Cole sua API Key aqui..." />
                <button class="btn-primary" onclick="submitApiKey()">Começar</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderHeader(week) {
      return `
        <header class="header">
          <div class="header-left">
            <span class="header-logo">▶</span>
            <span class="header-title">FlowPlayer</span>
          </div>
          <div class="header-center">
            <span class="week-badge">${week.label}</span>
            <span class="week-info">${week.channels.length} canais</span>
          </div>
          <button class="settings-btn" onclick="state.showSettings=true;render();">⚙</button>
        </header>`;
    }

    function renderTabs() {
      return `
        <div class="tab-bar">
          <button class="tab ${state.activeTab === 'videos' ? 'active' : ''}" onclick="state.activeTab='videos';saveLocal();render();">🎬 Vídeos</button>
          <button class="tab ${state.activeTab === 'courses' ? 'active' : ''}" onclick="state.activeTab='courses';saveLocal();render();">📚 Cursos</button>
        </div>`;
    }

    function renderVideosTab(week, ch, vids, vid) {
      const totalCh = week.channels.length;
      return `
        <div class="content">
          <!-- View toggle -->
          <div class="view-toggle">
            <button class="toggle-btn ${state.viewMode === 'videos' ? 'active' : ''}" onclick="setViewMode('videos')">🎬 Vídeos</button>
            <button class="toggle-btn ${state.viewMode === 'live' ? 'active' : ''}" onclick="setViewMode('live')">🔴 Ao Vivo</button>
          </div>

          <!-- Channel indicator -->
          <div class="channel-indicator">
            <span class="channel-name">${ch?.name || '—'}</span>
            <span class="channel-counter">Canal ${state.channelIndex + 1} de ${totalCh}</span>
          </div>

          <!-- Player -->
          <div class="player-wrapper">
            ${state.fetchingVideos
              ? `<div class="player-placeholder"><div class="spinner"></div><p style="margin-top:12px">Buscando vídeos de ${ch?.name}...</p></div>`
              : vid
                ? `<div class="player-inner" id="yt-player-wrapper"><div id="yt-player-target"></div></div>`
                : `<div class="player-placeholder"><p>${state.viewMode === 'live' ? 'Nenhuma live no momento' : 'Nenhum vídeo carregado'}</p>
                     <button class="ctrl-btn" style="margin-top:12px" onclick="refreshVideos()">🔄 Recarregar</button></div>`
            }
          </div>

          ${vid ? `<p class="video-title">${vid.title}</p>` : ''}

          <!-- Controls -->
          <div class="controls">
            <div class="control-group">
              <button class="ctrl-btn" onclick="prevVideo()" ${state.videoIndex === 0 ? 'disabled' : ''}>⏮ Vídeo</button>
              <button class="ctrl-btn-accent" onclick="nextVideo()">Vídeo ⏭</button>
            </div>
            <div class="control-group">
              <button class="ctrl-btn" onclick="prevChannel()" ${state.channelIndex === 0 ? 'disabled' : ''}>◁ Canal</button>
              <button class="ctrl-btn-accent" onclick="nextChannel()" ${state.channelIndex >= totalCh - 1 ? 'disabled' : ''}>Canal ▷</button>
            </div>
            <div class="speed-wrap">
              <button class="ctrl-btn" onclick="state.showSpeedMenu=!state.showSpeedMenu;render();">⚡ ${state.playbackSpeed}x</button>
              ${state.showSpeedMenu ? `<div class="speed-menu">
                ${SPEEDS.map(s => `<button class="speed-opt ${s === state.playbackSpeed ? 'active' : ''}" onclick="state.playbackSpeed=${s};state.showSpeedMenu=false;updateSpeed();saveLocal();render();">${s}x</button>`).join('')}
              </div>` : ''}
            </div>
            <button class="ctrl-btn" onclick="refreshVideos()">🔄</button>
            ${vid ? `<a class="ctrl-btn" href="https://www.youtube.com/watch?v=${vid.id}" target="_blank">↗ YouTube</a>` : ''}
          </div>

          ${state.error ? `<div class="error-bar">${state.error}</div>` : ''}

          <!-- Video list -->
          ${vids.length > 0 ? `
            <div style="margin-bottom:20px">
              <h3 class="list-title">Fila de vídeos</h3>
              ${vids.map((v, i) => `
                <button class="video-item ${i === state.videoIndex ? 'active' : ''}" onclick="selectVideo(${i})">
                  <img src="${v.thumb}" class="video-thumb" alt="" />
                  <div class="video-info">
                    <p class="video-item-title">${v.title}</p>
                    <p class="video-item-channel">${v.channel}</p>
                  </div>
                  ${i === state.videoIndex ? '<span class="now-playing">▶</span>' : ''}
                </button>
              `).join('')}
            </div>
          ` : ''}

          <!-- Channel list -->
          <div style="margin-bottom:20px">
            <h3 class="list-title">Canais — ${week.label}</h3>
            ${week.channels.map((c, i) => `
              <button class="channel-item ${i === state.channelIndex ? 'active' : ''}" onclick="selectChannel(${i})">
                <span class="channel-dot">${i === state.channelIndex ? '▶' : '○'}</span>
                <span>${c.name}</span>
                ${c.type === 'search' ? '<span class="search-badge">busca</span>' : ''}
              </button>
            `).join('')}
          </div>

          <!-- Keyboard shortcuts -->
          <div class="rotation-info">
            <strong>Atalhos (computador):</strong> N = próximo vídeo · P = vídeo anterior · Shift+→ = próximo canal · Shift+← = canal anterior
          </div>
        </div>`;
    }

    function renderCoursesTab() {
      const plat = PLATFORMS[state.platformIndex];
      const course = plat.courses[state.courseIndex];
      return `
        <div class="content">
          <div class="channel-indicator">
            <span class="channel-name">${plat.name}</span>
            <span class="channel-counter">Plataforma ${state.platformIndex + 1} de ${PLATFORMS.length}</span>
          </div>

          <div class="course-card" style="border-left: 4px solid ${plat.color}">
            <h3 class="course-title">${course.name}</h3>
            ${course.lastLesson ? `<p class="course-progress">Último progresso: ${course.lastLesson}</p>` : '<p class="course-progress">Início</p>'}
            <a href="${plat.url}" target="_blank" class="course-open-btn">Continuar curso ↗</a>
          </div>

          <div class="controls">
            <button class="ctrl-btn" onclick="nextCourse()">Próximo curso (mesma plataforma)</button>
            <button class="ctrl-btn-accent" onclick="nextPlatform()">Próxima plataforma ▷</button>
          </div>

          <div style="margin-bottom:20px;margin-top:8px">
            <h3 class="list-title">Plataformas</h3>
            ${PLATFORMS.map((p, i) => `
              <button class="channel-item ${i === state.platformIndex ? 'active' : ''}" onclick="selectPlatform(${i})">
                <span class="channel-dot" style="color:${p.color}">${i === state.platformIndex ? '▶' : '●'}</span>
                <div>
                  <span>${p.name}</span><br/>
                  <span style="font-size:12px;color:var(--text-muted)">${p.courses[0]?.name}</span>
                </div>
              </button>
            `).join('')}
          </div>

          <div class="rotation-info">
            <strong>Rodízio:</strong> Finalize o curso atual → próxima plataforma → quando voltar, comece o próximo curso desta plataforma.
          </div>
        </div>`;
    }

    function renderSettingsModal() {
      return `
        <div class="modal-overlay" onclick="state.showSettings=false;render();">
          <div class="modal-content" onclick="event.stopPropagation()">
            <h2 class="modal-title">Configurações</h2>
            <div class="setting-row">
              <label class="setting-label">Semana atual</label>
              <div class="week-selector">
                ${[0,1,2,3].map(i => `<button class="week-btn ${state.weekIndex === i ? 'active' : ''}" onclick="setWeek(${i})">${i+1}</button>`).join('')}
              </div>
            </div>
            <div class="setting-row">
              <label class="setting-label">API Key</label>
              <input type="text" class="input-field" value="${state.apiKey}" onchange="state.apiKey=this.value;saveLocal();" style="width:100%" />
            </div>
            <button class="btn-primary" onclick="state.showSettings=false;render();" style="width:100%;margin-top:8px">Fechar</button>
          </div>
        </div>`;
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    window.submitApiKey = function () {
      const v = document.getElementById("api-key-input")?.value?.trim();
      if (v) {
        state.apiKey = v;
        state.isSetup = true;
        saveLocal();
        loadYTApi();
        render();
        loadVideos(state.channelIndex, state.viewMode).then(() => { render(); setTimeout(playCurrentVideo, 500); });
      }
    };

    // Enter key on setup
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !state.isSetup) submitApiKey();
    });

    // Expose functions to onclick handlers
    window.nextVideo = nextVideo;
    window.prevVideo = prevVideo;
    window.nextChannel = nextChannel;
    window.prevChannel = prevChannel;
    window.selectChannel = selectChannel;
    window.selectVideo = selectVideo;
    window.setViewMode = setViewMode;
    window.refreshVideos = refreshVideos;
    window.setWeek = setWeek;
    window.nextPlatform = nextPlatform;
    window.nextCourse = nextCourse;
    window.selectPlatform = selectPlatform;
    window.updateSpeed = updateSpeed;

    // ============================================================
    // INIT
    // ============================================================
    loadLocal();
    // Auto-detect current week
    state.weekIndex = getWeekIndex();
    render();
    if (state.isSetup) {
      loadYTApi();
      loadVideos(state.channelIndex, state.viewMode).then(() => { render(); });
    }
  </script>
</body>
</html>
